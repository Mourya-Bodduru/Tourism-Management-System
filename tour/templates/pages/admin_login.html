{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/admin_login.css' %}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Admin Login</title>
</head>
<body style=" background-image: url('{% static "assets/Tahj.png" %}');
background-size: cover;
background-repeat: no-repeat;
background-position: center;
background-attachment: fixed;">

<a href="javascript:history.go(-1);" class="back-button">
    <i class="bx bx-arrow-back"></i>
</a>


     <div class="box">
        <div class="container">
            <form action="{% url 'admin_login' %}" method="POST" class="form">
                {% csrf_token %}
            <div class="input-field">
                <input type="text" class="input" name="username" placeholder="Username" required>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-field">
                <input type="password" class="input" name="password" placeholder="Password" required>
                <i class="bx bx-lock-alt"></i>
            </div>
            <div class="input-field">
                <input type="submit" class="submit" value="Login">
            </div>
            </form>
        </div>
    </div>
    {% if messages %}
<script>
    alert("{% for msg in messages %}{{ msg }}{% endfor %}");
</script>
{% endif %}
</body>
</html>
