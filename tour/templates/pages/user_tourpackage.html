{% extends "pages/master.html" %}
 {% load static %}

 {% block title %}
 Enquiries
 {% endblock %}
 {% block extra_head %}
 <link rel="stylesheet" href="{% static 'css/user_tourpackage.css' %}">
 
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
         integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
         integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
         crossorigin="anonymous"></script>  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
 {% endblock %}
 
 {% block content %}
 <body style=" background-image: url('{% static "assets/img11.jpg" %}');
 background-size: cover;
 background-repeat: no-repeat;
 background-position: center;
 background-attachment: fixed;">


<section class="sec1">
  {% for package in packages %}
    <div class="row4">
       <div class="col-12 d-flex justify-content-around">
           <div class="col-12">
               <div class="card mb-3" style="max-width: 540px;">
                   <div class="row g-0">
                       <div class="col-md-4">
                           <img src="{{ package.package_image.url }}" class="img-fluid rounded-start" alt="...">
                       </div>
                       <div class="col-md-8">
                           <div class="card-body">
                               <h5 class="card-title">{{ package.package_name }}</h5>
                               <p class="card-text">{{ package.package_features }}</p>
                               <a href="{% url 'details' package.pk %}"><button class="btn btn-primary">Details</button></a>
                           </div>
                       </div>
                   </div>
               </div>
           </div>  
       </div>
    </div>
   {% endfor %}
</section>
</body>
{% endblock %}
