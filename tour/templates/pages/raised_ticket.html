{% extends "pages/master.html" %}
{% load static %}

{% block title %}
Raised ticket
{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/raised_ticket.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
{% endblock %}

{% block content %}
<body style="background-image: url('{% static "assets/img11.jpg" %}');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    background-attachment: fixed;">

    <div class="suggest">
        <p class="colorful-text">Raise your package. If it is not present in Tour packages..</p>
    </div>

    <section class="sec1">
        <form action="{% url 'raised_ticket' %}" method="POST" class='form'><br>
            {% csrf_token %}
            <div class="form-floating mb-3">
                <input type="text" name="username" class="form-control rounded-pill border border-info" id="floatingInput"
                    placeholder="Username" required>
                <label for="floatingInput">Username</label>
            </div>
            <div class="form-floating mb-3">
                <input type="text" name="email" class="form-control rounded-pill border border-info" id="floatingInput"
                    placeholder="Email" required>
                <label for="floatingInput">Email</label>
            </div>
            <div class="form-floating mb-3">
                <input type="text" name="tour_name" class="form-control rounded-pill border border-info" id="floatingInput"
                    placeholder="Tour Name" required>
                <label for="floatingInput">Tour Name</label>
            </div>
            <div class="form-floating mb-3">
                <input type="text" name="location" class="form-control rounded-pill border border-info" id="floatingInput"
                    placeholder="Location" required>
                <label for="floatingInput">Location</label>
            </div>
            <div class="form-floating">
                <textarea class="form-control rounded-pill border border-info" name="details" placeholder=" Details"
                    id="floatingTextarea" required></textarea>
                <label for="floatingTextarea"> Details</label>
            </div><br>
            <button class="btn btn-primary butt" type="submit">Submit</button>
        </form>
        {% if messages %}
        <script>
            alert("{% for msg in messages %}{{ msg }}{% endfor %}");
        </script>
        {% endif %}
    </section>
</body>
{% endblock %}
